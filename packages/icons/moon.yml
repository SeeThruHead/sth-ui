$schema: https://moonrepo.dev/schemas/project.json
fileGroups:
  upstream:
    - /package.json
    - /packages/lint/package.json
    - /packages/lint/*.ts
    - /packages/lint/oxlintrc.json
    - /packages/testing/package.json
    - /packages/testing/src/**/*
tasks:
  typecheck:
    command: bun run typecheck
    inputs: ["**/*", "@group(upstream)"]
  lint:
    command: bun run lint
    inputs: ["**/*", "@group(upstream)"]
  test:
    command: bun run test
    inputs: ["src/**/*", "tools/**/*", "vitest.config.ts", "@group(upstream)"]
  build:
    command: bun run build
    inputs: ["src/**/*", "tsconfig.json", "tsconfig.build.json", "@group(upstream)"]
    outputs: ["lib"]
  format:
    command: bun run format:check
    inputs: ["**/*", /.oxfmtrc.json]
  check:
    deps: [typecheck, lint, format, test]
