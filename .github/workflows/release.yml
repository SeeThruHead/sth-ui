name: release
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check every project
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.7"
          verb: call
          args: check --source .

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that publishes with GitHub's OIDC token
        run: npm install --global npm@latest
      - name: See whether npm already has this version
        id: existing
        run: |
          if npm view "@seethruhead/sth-ui@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.existing.outputs.published != 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish the release to npm as latest
        if: steps.existing.outputs.published != 'true'
        working-directory: packages/release
        run: bun run publish:release --tag "$GITHUB_REF_NAME"
