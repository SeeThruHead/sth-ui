name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check every project
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.7"
          verb: call
          args: check --source .
